name: ML Model Retraining Pipeline

on:
  # Run automatically every Sunday at midnight (UTC)
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  retrain-xgboost:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          pip install -r ml_model/requirements.txt
          
      - name: Authenticate with Firebase
        run: |
          # Create the service account file securely from GitHub Secrets
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > service_account.json
          
      - name: Run Retraining Script
        env:
          # This tells firebase-admin to use our securely created service account file
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: |
          cd ml_model
          python retrain_pipeline.py
          
      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f service_account.json
